# cargo-deny policy for the desktop app's Rust workspace.
# CI runs `cargo deny check advisories licenses` against this file.

[advisories]
version = 2
# Fail on RustSec advisories for any crate in the lockfile, including yanked
# releases of dependencies.
yanked = "deny"
ignore = [
  # RUSTSEC-2025-0075/-0080/-0081/-0098/-0100: the unic-* crates are
  # unmaintained (status advisories, no vulnerabilities). Transitive via
  # tauri-utils -> urlpattern in Tauri 2.x and there is no upstream fix yet.
  # Re-check after Tauri upgrades.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[licenses]
version = 2
# Permissive licenses known to be in this dependency tree. Extend rather than
# weaken when a new dependency pulls in a differently-licensed crate.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
# Duplicate versions are noisy but harmless here; advisories/licenses are the gate.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
